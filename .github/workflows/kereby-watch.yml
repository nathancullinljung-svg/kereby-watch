# The apartment watcher itself. Checks kereby.dk for newly available flats and
# sends a Telegram message. State lives in seen.json, committed
# back by this workflow, which is what makes each alert fire exactly once.
#
# Cadence is set by the schedule below plus two optional repository variables:
#   LOOP_MINUTES     0 (default) = one check per scheduled run.
#                    >0 = keep checking inside the run for that many minutes,
#                    which is how you get a sub-5-minute cadence. Only sensible
#                    on a repo with unmetered Actions minutes (i.e. public).
#   CHECK_SECONDS    gap between checks while looping (default 60).
name: Kereby watch

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 min -- GitHub's fastest cron. Free here
                              # because Actions minutes are unmetered on public
                              # repositories. Scheduled runs are best-effort, so
                              # the real gap is 5-15 min; see LOOP_MINUTES.
  workflow_dispatch: {}

permissions:
  contents: write             # to commit seen.json back

concurrency:
  group: kereby-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Watch for available apartments
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides and filters (repo "Variables" tab):
          KEREBY_URL:    ${{ vars.KEREBY_URL }}
          MAX_PRICE:     ${{ vars.MAX_PRICE }}
          MIN_ROOMS:     ${{ vars.MIN_ROOMS }}
          MIN_SQM:       ${{ vars.MIN_SQM }}
          AREAS:         ${{ vars.AREAS }}
          LOOP_MINUTES:  ${{ vars.LOOP_MINUTES }}
          CHECK_SECONDS: ${{ vars.CHECK_SECONDS }}
        run: |
          loop_for=${LOOP_MINUTES:-0}
          gap=${CHECK_SECONDS:-60}

          if [ "$loop_for" -eq 0 ]; then
            python kereby_watch.py          # one check; a failure fails the run
            exit $?
          fi

          # Looping: one bad check must not end the run. The watcher messages
          # you itself after several consecutive failures, so nothing is hidden.
          deadline=$(( $(date +%s) + 60 * loop_for ))
          checks=0
          while :; do
            python kereby_watch.py || echo "check failed; continuing"
            checks=$((checks + 1))
            now=$(date +%s)
            [ $(( now + gap )) -lt "$deadline" ] || break
            sleep "$gap"
          done
          echo "Ran $checks checks over ${loop_for}m."

      - name: Persist state
        if: always()          # an alert already sent must not be sent twice
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name  "kereby-bot"
            git config user.email "bot@users.noreply.github.com"
            git add seen.json
            git commit -m "kereby: update state [skip ci]"
            for i in 1 2 3; do
              git push && exit 0
              sleep $((i * 3))
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            git push
          else
            echo "No state change."
          fi

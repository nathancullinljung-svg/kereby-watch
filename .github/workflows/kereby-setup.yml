# Connects the apartment watcher to Telegram, for someone with no terminal.
#
# Run it once after adding the TELEGRAM_BOT_TOKEN secret: it finds the chat you
# started with your bot and sends you your chat id in Telegram, so you can copy
# it straight into the TELEGRAM_CHAT_ID secret. Run it again afterwards and it
# sends a test message instead, confirming both secrets work.
name: Kereby setup

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Check the bot and report the chat id
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::The TELEGRAM_BOT_TOKEN secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions,"
            echo "then run this workflow again. See HANDOFF.md."
            exit 1
          fi

          set +e
          python kereby_watch.py --setup 2>&1 | tee setup.log
          code=${PIPESTATUS[0]}
          set -e

          # Everything the run has to say, on the run's summary page -- easier
          # to read on a phone than the log.
          {
            echo "## Kereby setup"
            echo
            echo '```'
            cat setup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 3 = "you still need to message your bot in Telegram". That is a
          # normal step in the setup, not a failure, so don't fail the run.
          if [ "$code" -eq 3 ]; then
            echo "::warning::Setup not finished: message your bot in Telegram, then run this again. Details in the summary."
            exit 0
          elif [ "$code" -ne 0 ]; then
            echo "::error::Setup failed -- see the summary for what to fix."
            exit "$code"
          elif [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Check Telegram: your bot has sent you your chat id. Add it as the TELEGRAM_CHAT_ID secret, then run this workflow again."
          else
            echo "::notice::Connected. Both secrets work and a test message was sent."
          fi
